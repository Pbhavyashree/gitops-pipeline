# Production. Differs from staging only in scale, log level and spread —
# anything else differing would mean staging is not testing what ships.

replicaCount: 3

config:
  environment: production
  # INFO rather than DEBUG: debug logging in production costs money in log
  # storage and buries the lines that matter.
  logLevel: INFO

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65

podDisruptionBudget:
  enabled: true
  minAvailable: 2

serviceMonitor:
  enabled: true

# Spread replicas across nodes so losing one node cannot take out the service.
# Preferred rather than required, so a small cluster can still schedule.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - task-api
          topologyKey: kubernetes.io/hostname

ingress:
  enabled: true
  hosts:
    - host: task-api.local
      paths:
        - path: /
          pathType: Prefix
