apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "task-api.fullname" . }}-config
  labels:
    {{- include "task-api.labels" . | nindent 4 }}
data:
  # Read by pydantic-settings via the APP_ prefix. The same image runs in
  # every environment; only these values differ.
  APP_VERSION: {{ .Chart.AppVersion | quote }}
  APP_ENVIRONMENT: {{ .Values.config.environment | quote }}
  APP_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
