name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/task-api

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Format check
        run: ruff format --check app tests

      - name: Tests
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85

  helm:
    name: Validate Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Lint chart
        run: helm lint charts/task-api

      # Rendering every environment catches template errors that lint alone
      # misses — a values file that references a key the template does not
      # handle only fails when it is actually rendered.
      - name: Render staging
        run: helm template task-api charts/task-api -f charts/task-api/values.yaml -f charts/task-api/values-staging.yaml

      - name: Render production
        run: helm template task-api charts/task-api -f charts/task-api/values.yaml -f charts/task-api/values-production.yaml

  build:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: [test, helm]
    # Only push from main and tags. Pull requests build the image to prove it
    # compiles, but must not publish.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    name: Scan image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      # Fails the pipeline on a critical or high CVE rather than filing a
      # report nobody reads. ignore-unfixed skips findings with no patch
      # available, which would otherwise block every build indefinitely.
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  promote:
    name: Update staging image tag
    runs-on: ubuntu-latest
    needs: [build, scan]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # This is the GitOps handoff. CI does not deploy — it writes the new
      # image tag into git, and ArgoCD notices the commit and reconciles the
      # cluster to match. The cluster's desired state lives in this file, not
      # in a pipeline's imperative kubectl call.
      - name: Write image tag into staging values
        run: |
          TAG="sha-${{ github.sha }}"
          sed -i "s|^  tag: .*|  tag: \"${TAG}\"|" charts/task-api/values-staging.yaml
          if git diff --quiet; then
            echo "Image tag unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/task-api/values-staging.yaml
          git commit -m "chore: deploy ${TAG} to staging [skip ci]"
          git push
